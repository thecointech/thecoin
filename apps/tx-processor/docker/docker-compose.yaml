services:
  tx-processor-init:
    image: alpine:latest
    volumes:
      - type: volume
        source: tx-processor-data
        target: /data
    command: ["sh", "-c", "chown -R 10042:10042 /data && chmod -R 755 /data"]
    restart: "no"

  tx-processor:
    depends_on:
      - tx-processor-init
    image: ghcr.io/thecointech/thecoin/tx-processor:${CONFIG_NAME:-prod}-latest
    pull_policy: always
    platform: linux/amd64
    environment:
      - CONFIG_NAME=${CONFIG_NAME:-prod}
    volumes:
      # Persistent runtime data
      - type: volume
        source: tx-processor-data
        target: /data
      # Secrets from host machine (read-only)
      - type: bind
        source: ${THECOIN_SECRETS?THECOIN_SECRETS environment variable is required}
        target: /secrets
        read_only: true
    restart: "no"

volumes:
  tx-processor-data:
    name: tx-processor-data-${CONFIG_NAME:-prod}