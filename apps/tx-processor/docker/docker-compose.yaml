services:
  tx-processor:
    # for service
    #image: ghcr.io/thecointech/thecoin/tx-processor:${CONFIG_NAME:-prod}-latest
    #pull_policy: always
    # For local builds
    image: tx-processor
    environment:
      - CONFIG_NAME=${CONFIG_NAME:-prod}
      - LOG_NAME=tx-processor
      # If set, will verify every run, (default 1 per day)
      # Useful for forcing bank verification
      # - ALWAYS_VERIFY_BANK=true
      # If set, will report harvest status every <number> ms (default OneWeek)
      # - HARVESTER_MONITOR_REPORT_PERIOD=<number>
      # - THECOIN_SCRAPER_BROWSER=firefox
    volumes:
      # Persistent runtime data
      # Either a bind or tx-processor-data volume
      - type: bind
        source: /var/tx-data
        target: /data
      # Secrets from host machine (read-only)
      - type: bind
        source: ${THECOIN_SECRETS?THECOIN_SECRETS environment variable is required}
        target: /secrets
        read_only: true
    restart: "no"

volumes:
  tx-processor-data:
    name: tx-processor-data-${CONFIG_NAME:-prod}
